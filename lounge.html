<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lounge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --bg: #1a1118; --bg2: #221620; --bg-today: #2a1a24; --border: #3d2a38; --border-today: #6b3a52;
    --gold: #c9954a; --gold-dim: #6b4d27; --warm: #f0d4a8; --muted: #a08898; --live: #e8a060;
    --cal-main: #5dbf7a; --cal-household: #e07840; --cal-dinner: #e05070;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: #000; transform-origin: 0 0; overflow: hidden; font-family: 'Archivo', sans-serif; color: var(--warm); }
  .block { position: absolute; }
  .gem { width: 4px; height: 4px; background: var(--gold-dim); transform: rotate(45deg); display: inline-block; }

  /* ── PHOTO + FRAME ── */
  #photo { left: 12px; top: 13px; width: 527px; height: 778px; overflow: hidden; background: #120c10; z-index: 113; }
  #photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 2s ease; }
  #photo img.on { opacity: 1; }
  #photo .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); z-index: 2; }
  #photo .empty { position: absolute; inset: 0; background: radial-gradient(ellipse at center, #2a1a24 0%, #120c10 75%); }
  #frame { left: 1px; top: 4px; width: 548px; height: 794px; pointer-events: none; z-index: 118; }
  #frame::before { content: ''; position: absolute; inset: 6px; border: 1px solid #c9954a; border-radius: 2px; }
  #frame::after { content: ''; position: absolute; inset: 10px; border: 1px solid rgba(201,149,74,.35); border-radius: 1px; }
  #frame .corner { position: absolute; width: 20px; height: 20px; }
  #frame .corner::before, #frame .corner::after { content: ''; position: absolute; background: #c9954a; }
  #frame .corner::before { width: 100%; height: 1.5px; top: 0; left: 0; }
  #frame .corner::after { width: 1.5px; height: 100%; top: 0; left: 0; }
  #frame .tl { top: 3px; left: 3px; } #frame .tr { top: 3px; right: 3px; transform: scaleX(-1); }
  #frame .bl { bottom: 3px; left: 3px; transform: scaleY(-1); } #frame .br { bottom: 3px; right: 3px; transform: scale(-1); }
  #frame .fgem { position: absolute; width: 6px; height: 6px; background: #c9954a; transform: rotate(45deg); }
  #frame .fgem.top { top: 4px; left: 50%; margin-left: -3px; } #frame .fgem.bottom { bottom: 4px; left: 50%; margin-left: -3px; }
  #frame .fgem.left { left: 4px; top: 50%; margin-top: -3px; } #frame .fgem.right { right: 4px; top: 50%; margin-top: -3px; }

  /* ── CLOCK + WEATHER ── */
  #clockw { left: 541px; top: 0; width: 341px; height: 386px; padding: 7px; z-index: 117; }
  .wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .row-time { background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex: 2; min-height: 0; padding: 6px 14px; gap: 4px; }
  .time-left { display: flex; align-items: flex-start; gap: 3px; flex: 1; min-width: 0; justify-content: center; }
  .time-main { font-family: 'Cinzel', serif; font-weight: 700; font-size: 40px; line-height: 1; color: var(--warm); letter-spacing: 2px; white-space: nowrap; }
  .time-right { display: flex; flex-direction: column; align-items: flex-start; padding-top: 4px; gap: 1px; }
  .time-sec { font-family: 'Cinzel', serif; font-weight: 700; font-size: 18px; color: var(--gold); line-height: 1; }
  .time-ampm { font-family: 'Cinzel', serif; font-size: 11px; color: var(--muted); letter-spacing: 2px; line-height: 1; }
  .moon-side { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; border-left: 1px solid var(--border); padding-left: 12px; margin-left: 8px; }
  .moon-side svg { width: 40px; height: 40px; display: block; }
  .moon-phase { font-family: 'Cinzel', serif; font-size: 7px; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; text-align: center; }
  .moon-illum { font-size: 6px; color: var(--muted); text-align: center; }
  .row-info { background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; padding: 5px 12px; gap: 8px; }
  .info-weather { display: flex; align-items: center; gap: 6px; }
  .info-icon { font-size: 22px; }
  .info-temp { font-family: 'Archivo Black', sans-serif; font-size: 20px; color: var(--warm); line-height: 1; white-space: nowrap; }
  .info-temp sup { font-size: .5em; color: var(--muted); vertical-align: super; }
  .info-detail { display: flex; flex-direction: column; }
  .info-cond { font-size: 8px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .info-feels { font-family: 'Cinzel', serif; font-size: 9px; color: var(--warm); }
  .info-highlow { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
  .highlow-item { display: flex; align-items: center; gap: 4px; }
  .highlow-label { font-size: 6px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .highlow-val { font-family: 'Cinzel', serif; font-size: 11px; color: var(--warm); white-space: nowrap; }
  .row-sunbar { padding: 6px 12px 7px; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; }
  .sunbar-track { position: relative; height: 2px; background: #3d2a38; border-radius: 1px; }
  .sunbar-fill { position: absolute; left: 0; top: 0; height: 100%; background: #c9954a; border-radius: 1px; }
  .sunbar-dot { position: absolute; top: 50%; transform: translate(-50%,-50%); width: 7px; height: 7px; border-radius: 50%; background: #f5c97a; border: 1.5px solid #c9954a; }
  .sunbar-labels { display: flex; justify-content: space-between; align-items: center; }
  .sunbar-label { font-size: 6px; color: var(--muted); letter-spacing: 1px; }
  .sunbar-remaining { font-size: 6px; color: var(--gold); letter-spacing: 1px; }
  .forecast-col { display: flex; flex: 2; min-height: 0; }
  .fc-day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px; border-right: 1px solid var(--border); min-width: 0; }
  .fc-day:last-child { border-right: none; }
  .fc-label { font-family: 'Cinzel', serif; font-size: 8px; color: var(--warm); letter-spacing: 1px; text-transform: uppercase; }
  .fc-icon { font-size: 20px; line-height: 1; }
  .fc-high { font-family: 'Archivo Black', sans-serif; font-size: 15px; color: var(--warm); }
  .fc-rain { font-size: 8px; color: var(--muted); }
  .fc-rain.wet { color: #7aaecc; }
  .footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 2px 12px; font-size: 5px; color: var(--muted); letter-spacing: 1px; display: flex; justify-content: space-between; flex-shrink: 0; }

  /* ── CONCERTS ── */
  #concerts { left: 541px; top: 374px; width: 340px; height: 260px; padding: 7px; z-index: 119; }
  #concerts .wrap { border-radius: 10px; }
  .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 5px 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .title { font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 1.5px; }
  .month-label { font-size: 6px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; padding: 3px 12px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
  .events { flex: 1; overflow: hidden; padding: 2px 0; }
  .c-row { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 12px; border-bottom: 1px solid var(--border); }
  .c-row:last-child { border-bottom: none; }
  .c-name { font-family: 'Cinzel', serif; font-size: 9px; font-weight: 700; color: var(--gold); flex: 1; margin-right: 8px; }
  .c-date { font-size: 8px; color: var(--warm); white-space: nowrap; }
  .no-events { padding: 8px 12px; display: flex; flex-direction: column; gap: 3px; }
  .no-label { font-size: 7px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .no-month { font-family: 'Cinzel', serif; font-size: 11px; color: var(--gold); }
  .no-detail { font-size: 8px; color: var(--warm); }

  /* ── CALENDAR ── */
  #calendar { left: 872px; top: 0; width: 404px; height: 638px; padding: 7px; z-index: 116; }
  #calendar .header { padding: 8px 14px; }
  #calendar .title { font-size: 11px; }
  .legend { display: flex; gap: 10px; align-items: center; padding: 5px 14px; flex-shrink: 0; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 6px; height: 6px; border-radius: 50%; }
  .legend-label { font-size: 7px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .days { padding: 4px 0; overflow: hidden; flex: 1; }
  .day-block { padding: 4px 14px; }
  .day-block + .day-block { border-top: 1px solid var(--border); }
  .day-block.today-block { background: var(--bg-today); border-top: 1px solid var(--border-today); border-bottom: 1px solid var(--border-today); padding: 8px 14px; position: relative; }
  .day-block.today-block::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); border-radius: 0 2px 2px 0; }
  .day-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
  .day-name { font-family: 'Cinzel', serif; font-size: 9px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .day-date { font-size: 8px; color: var(--muted); letter-spacing: 1px; }
  .today-block .day-name { font-size: 14px; color: #f5c97a; text-shadow: 0 0 8px rgba(245,201,122,.4); }
  .today-block .day-date { font-size: 11px; color: #d4a855; }
  .event-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .event-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .event-dot.cal-main { background: var(--cal-main); } .event-dot.cal-household { background: var(--cal-household); } .event-dot.cal-dinner { background: var(--cal-dinner); }
  .event-dot.allday { border-radius: 2px; }
  .event-time { font-size: 10px; color: var(--muted); min-width: 38px; flex-shrink: 0; }
  .event-name { font-size: 10px; color: var(--warm); line-height: 1.3; flex: 1; }
  .today-block .event-time, .today-block .event-name { font-size: 11px; }
  .no-ev { font-size: 8px; color: var(--muted); font-style: italic; }
  .status { padding: 16px 14px; font-size: 9px; color: var(--muted); font-style: italic; }

  /* ── SPORTS ── */
  #sports { left: 541px; top: 626px; width: 733px; height: 172px; padding: 5px; z-index: 115; display: flex; align-items: flex-start; justify-content: center; }
  .game-vs { font-size: 5px; color: var(--muted); text-align: center; width: 100%; }
  #sports .card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; width: 100%; overflow: hidden; }
  #sports .card-header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 4px 8px; display: flex; align-items: center; justify-content: space-between; }
  #sports .card-title { font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 2px; color: var(--gold); }
  .games-row { display: flex; align-items: stretch; }
  .game-card { flex: 2; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 4px; border-right: 1px solid var(--border); position: relative; overflow: hidden; }
  .game-card:last-child { border-right: none; }
  .game-card.mini { flex: 1; opacity: .5; padding: 4px 3px; }
  .game-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .game-card.nfl::before { background: #4a7c59; } .game-card.nba-phi::before { background: #3a7ab0; }
  .team-logo { width: 16px; height: 16px; object-fit: contain; border-radius: 50%; }
  .game-card.mini .team-logo { width: 10px; height: 10px; }
  .team-abbr { font-family: 'Archivo Black', sans-serif; font-size: 7px; line-height: 1; color: var(--warm); white-space: nowrap; }
  .game-card.mini .team-abbr { font-size: 5px; }
  .game-time { font-size: 5px; font-weight: 600; color: var(--warm); text-align: center; line-height: 1.3; white-space: pre-line; }
  .game-time.live { color: var(--live); } .game-time.tbd { color: var(--muted); font-style: italic; }
  .live-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--live); margin-right: 2px; animation: blink 1.2s infinite; vertical-align: middle; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  #sports .card-footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 2px 8px; font-size: 5px; color: var(--muted); display: flex; justify-content: space-between; }

  /* ── WEATHER LAYER + NIGHT DIM ── */
  #fx { left: 0; top: 0; width: 1280px; height: 800px; pointer-events: none; z-index: 120; }
  #dim { left: 0; top: 0; width: 1280px; height: 800px; background: #000; opacity: 0; pointer-events: none; z-index: 200; transition: opacity 3s; }
</style>
</head>
<body>
<div id="stage">
  <div class="block" id="photo"><div class="empty"></div><div class="vignette"></div></div>
  <div class="block" id="frame">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="fgem top"></div><div class="fgem bottom"></div><div class="fgem left"></div><div class="fgem right"></div>
  </div>

  <div class="block" id="clockw">
    <div class="wrap">
      <div class="row-time">
        <div class="time-left">
          <span class="time-main" id="time-main">--:--</span>
          <div class="time-right"><span class="time-sec" id="time-sec">:00</span><span class="time-ampm" id="time-ampm"></span></div>
        </div>
        <div class="moon-side">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#2a1a24"/><path id="moon-path" fill="#f0d4a8"/></svg>
          <div class="moon-phase" id="moon-phase">—</div>
          <div class="moon-illum" id="moon-illum">—</div>
        </div>
      </div>
      <div class="row-info">
        <div class="info-weather">
          <div class="info-icon" id="main-icon">🌤️</div>
          <div class="info-temp" id="cur-temp">—<sup>°F</sup></div>
          <div class="info-detail"><div class="info-cond" id="cur-cond">Loading</div><div class="info-feels" id="feels-line">—</div></div>
        </div>
        <div class="info-highlow">
          <div class="highlow-item"><div class="highlow-label">High</div><div class="highlow-val" id="temp-high">—</div></div>
          <div class="highlow-item"><div class="highlow-label">Low</div><div class="highlow-val" id="temp-low">—</div></div>
        </div>
      </div>
      <div class="row-sunbar">
        <div class="sunbar-track"><div class="sunbar-fill" id="sun-fill" style="width:0%"></div><div class="sunbar-dot" id="sun-dot" style="left:0%"></div></div>
        <div class="sunbar-labels"><div class="sunbar-label" id="bar-rise">🌅 —</div><div class="sunbar-remaining" id="bar-remaining">—</div><div class="sunbar-label" id="bar-set">— 🌇</div></div>
      </div>
      <div class="forecast-col" id="forecast-row"></div>
      <div class="footer"><span id="w-updated">—</span><span>Open-Meteo</span></div>
    </div>
  </div>

  <div class="block" id="concerts">
    <div class="wrap">
      <div class="header"><div class="gem"></div><div class="title">Concerts · Movies · Shows</div><div class="gem"></div></div>
      <div class="month-label" id="month-label">—</div>
      <div class="events" id="c-events"><div class="no-events"><div class="no-label">Loading…</div></div></div>
      <div class="footer"><span id="c-updated">—</span><span>Google Calendar</span></div>
    </div>
  </div>

  <div class="block" id="calendar">
    <div class="wrap">
      <div class="header"><div class="gem"></div><div class="title">Upcoming Events</div><div class="gem"></div></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--cal-main)"></div><div class="legend-label">Amanda's Calendar</div></div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--cal-household)"></div><div class="legend-label">Household</div></div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--cal-dinner)"></div><div class="legend-label">Dinner</div></div>
      </div>
      <div class="days" id="days"><div class="status">Fetching your calendar…</div></div>
      <div class="footer"><span id="cal-updated">—</span><span>Google Calendar</span></div>
    </div>
  </div>

  <div class="block" id="sports">
    <div class="card">
      <div class="card-header"><div class="gem"></div><div class="card-title" id="sports-title">Next Games</div><div class="gem"></div></div>
      <div class="games-row" id="games-row"></div>
      <div class="card-footer"><span id="s-updated">Updating every 5 min</span><span>ESPN</span></div>
    </div>
  </div>

  <canvas class="block" id="fx" width="1280" height="800"></canvas>
  <div class="block" id="dim"></div>
</div>

<script>
(function () {
  'use strict';
  var CFG = window.DASH_CONFIG || {};
  var LOC = CFG.lounge || { lat: 41.685, lon: -73.733 };
  var TZ = CFG.timezone || 'America/New_York';
  var W = 1280, H = 800;

  /* ── Fit the 1280×800 board to the screen (Fire Stick reports 960×540) ── */
  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    var ox = (window.innerWidth - W * s) / 2, oy = (window.innerHeight - H * s) / 2;
    document.getElementById('stage').style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  /* ── New York wall-clock helpers ──
     Every time on this board is handled as New York "wall time", stored as
     Date.UTC(y, m, d, h, mi). That keeps day boundaries right no matter what
     time zone the Fire Stick thinks it is in. */
  var fmtParts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false });
  function wallOf(date) {
    var p = {}; fmtParts.formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
    return Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
  }
  function nowWall() { return wallOf(new Date()); }
  var DAY = 86400000;
  function dayStart(w) { var d = new Date(w); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var DOW3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function clock12(w) { var d = new Date(w), h = d.getUTCHours(), m = d.getUTCMinutes(); return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm'); }
  function updatedStamp() { var d = new Date(nowWall()), h = d.getUTCHours(); return 'Updated ' + (h % 12 || 12) + ':' + String(d.getUTCMinutes()).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM'); }

  /* ── Clock ── */
  function tick() {
    var d = new Date(nowWall()), h = d.getUTCHours();
    document.getElementById('time-main').textContent = (h % 12 || 12) + ':' + String(d.getUTCMinutes()).padStart(2, '0');
    document.getElementById('time-sec').textContent = ':' + String(d.getUTCSeconds()).padStart(2, '0');
    document.getElementById('time-ampm').textContent = h < 12 ? 'AM' : 'PM';
  }

  /* ── Moon ── */
  var SYN = 29.530588853;
  function moonAge() { var days = (Date.now() - Date.UTC(2000, 0, 6, 18, 14)) / DAY; return ((days % SYN) + SYN) % SYN; }
  function phaseName(f) {
    if (f < 0.0339 || f > 0.9661) return 'New Moon'; if (f < 0.2161) return 'Waxing Crescent'; if (f < 0.2839) return 'First Quarter';
    if (f < 0.4661) return 'Waxing Gibbous'; if (f < 0.5339) return 'Full Moon'; if (f < 0.7161) return 'Waning Gibbous';
    if (f < 0.7839) return 'Last Quarter'; return 'Waning Crescent';
  }
  function updateMoon() {
    var f = moonAge() / SYN, waxing = f < 0.5, illum = (1 - Math.cos(2 * Math.PI * f)) / 2, r = 16, cx = 20, cy = 20;
    var rx = Math.abs(1 - 2 * illum) * r, limb = waxing ? 1 : 0, term = (illum > 0.5) === waxing ? 1 : 0;
    document.getElementById('moon-path').setAttribute('d', illum < 0.01 ? '' :
      'M ' + cx + ' ' + (cy - r) + ' A ' + r + ' ' + r + ' 0 0 ' + limb + ' ' + cx + ' ' + (cy + r) + ' A ' + rx + ' ' + r + ' 0 0 ' + term + ' ' + cx + ' ' + (cy - r) + ' Z');
    document.getElementById('moon-phase').textContent = phaseName(f);

        if (shoot) { shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt; shoot.life -= dt * 1.4;
          var gr = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 0.12, shoot.y - shoot.vy * 0.12);
          gr.addColorStop(0, 'rgba(255,255,255,' + Math.max(shoot.life, 0) + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.strokeStyle = gr; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx * 0.12, shoot.y - shoot.vy * 0.12); ctx.stroke();
          if (shoot.life <= 0) shoot = null; }
      }
      if (/storm/.test(mode)) {             // lightning
        if (t > nextBolt) { flash = 1; nextBolt = t + rnd(6000, 16000); }
        if (flash > 0) { ctx.fillStyle = 'rgba(200,210,255,' + (flash * 0.18).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); flash -= dt * 3; }
      }
      // soft edge vignette
      var v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.7);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, /night/.test(mode) ? 'rgba(5,10,45,0.30)' : 'rgba(0,0,0,0.28)');
      ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    }
    requestAnimationFrame(draw);
    return { setCondition: function (w) { var m = modeOf(w); if (m !== mode || !parts.length) { mode = m; build(); } } };
  })();

  /* ── Go ── */
  tick(); updateMoon(); updateDim(); fetchWeather(); fetchFeed(); fetchGames(); fx.setCondition(wx);
  setInterval(tick, 1000);
  setInterval(function () { updateSunBar(); updateDim(); }, 30 * 1000);
  setInterval(updateMoon, 10 * 60 * 1000);
  setInterval(fetchWeather, 10 * 60 * 1000);
  setInterval(fetchFeed, 15 * 60 * 1000);
  setInterval(fetchGames, 5 * 60 * 1000);
  setTimeout(function () { location.reload(); }, 6 * 60 * 60 * 1000);   // fresh start every 6 hours
})();
</script>
